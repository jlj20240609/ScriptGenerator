<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<title>框选</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; cursor: crosshair;
    font-family: "Microsoft YaHei", system-ui, sans-serif; user-select: none; }
  canvas { position: fixed; inset: 0; }
  #hint { position: fixed; left: 50%; top: 22px; transform: translateX(-50%);
    background: rgba(15,23,42,.92); color: #fff; padding: 10px 18px; border-radius: 10px;
    font-size: 15px; letter-spacing: .3px; pointer-events: none; z-index: 5; }
  #tip { position: fixed; left: 50%; bottom: 26px; transform: translateX(-50%);
    color: #e2e8f0; background: rgba(15,23,42,.7); padding: 6px 14px; border-radius: 8px;
    font-size: 13px; pointer-events: none; z-index: 5; }
</style>
</head>
<body>
  <canvas id="cv"></canvas>
  <div id="hint">第一步：框住要做操作的整个页面（比如浏览器窗口）</div>
  <div id="tip">拖拽框选 · 按 Esc 取消</div>
  <script src="overlay.js"></script>
</body>
</html>
